<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">HADARA operating model</title>
  <desc id="desc">Human intent goes to a coding agent. The agent uses the HADARA CLI protocol to update canonical state and evidence. Human-readable projections return the result for review.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#bda46a"/></marker>
    <style>
      .box{fill:#182123;stroke:#bda46a;stroke-width:2}.title{fill:#eee5cf;font:600 22px sans-serif}.sub{fill:#aeb7ae;font:15px monospace}.flow{fill:none;stroke:#78a5a0;stroke-width:3;marker-end:url(#arrow)}.return{fill:none;stroke:#dbc482;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="360" rx="24" fill="#0b1113"/>
  <rect class="box" x="35" y="130" width="200" height="100" rx="16"/>
  <text class="title" x="135" y="172" text-anchor="middle">Human</text><text class="sub" x="135" y="199" text-anchor="middle">intent · review · approval</text>
  <rect class="box" x="285" y="130" width="220" height="100" rx="16"/>
  <text class="title" x="395" y="172" text-anchor="middle">Coding agent</text><text class="sub" x="395" y="199" text-anchor="middle">bounded implementation</text>
  <rect class="box" x="555" y="75" width="245" height="100" rx="16"/>
  <text class="title" x="677" y="117" text-anchor="middle">HADARA CLI</text><text class="sub" x="677" y="144" text-anchor="middle">status · task · evidence · close</text>
  <rect class="box" x="555" y="215" width="245" height="100" rx="16"/>
  <text class="title" x="677" y="257" text-anchor="middle">Canonical state</text><text class="sub" x="677" y="284" text-anchor="middle">capsules · project · evidence</text>
  <rect class="box" x="850" y="130" width="315" height="100" rx="16"/>
  <text class="title" x="1007" y="172" text-anchor="middle">Human-readable projections</text><text class="sub" x="1007" y="199" text-anchor="middle">EVIDENCE.md · reports · docs</text>
  <path class="flow" d="M235 180h40"/><path class="flow" d="M505 180h35q15 0 15-15V125h0"/>
  <path class="flow" d="M677 175v30"/><path class="flow" d="M800 265h30q20 0 20-20v-35"/>
  <path class="return" d="M850 205H825q-25 0-25 25v95H135q-25 0-25-25v-70"/>
</svg>
