    <style>/* HADARA Operator Console — Phase 5.6 design system.
   Tokens and components per docs/DASHBOARD_DESIGN_LANGUAGE.md. */

:root {
  --bg: #0c1418;
  --surface: #121d22;
  --surface-2: #18262c;
  --surface-3: #20323a;
  --border: rgba(120, 210, 222, 0.14);
  --border-strong: rgba(201, 166, 107, 0.34);

  --text: #eef1ea;
  --muted: #aeb9b3;
  --faint: #939d96;

  --accent: #79d2de;
  --accent-2: #c9a66b;

  --ok: #6fd99a;
  --warn: #efc169;
  --danger: #f08a86;
  --info: #8fb7e8;

  --radius-ctl: 6px;
  --radius-card: 10px;
  --radius-region: 14px;
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset, 0 12px 32px rgba(0, 0, 0, 0.3);

  --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.mono {
  font-family: var(--mono);
  font-size: 13px;
}

/* layout ------------------------------------------------------------------ */

.root {
  display: grid;
  grid-template-columns: 248px 1fr;
  min-height: 100vh;
}

.frame {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.sidebar {
  background: linear-gradient(180deg, #0f181d, #0b1216);
  border-right: 1px solid var(--border);
  padding: 24px 16px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-mark {
  color: var(--accent-2);
  font-size: 18px;
}
.brand-name {
  font-weight: 700;
  letter-spacing: 0.12em;
  font-size: 15px;
}
.brand-sub {
  color: var(--faint);
  font-size: 12px;
  margin-top: -14px;
  padding-left: 28px;
}

.nav-group {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.nav-label {
  color: var(--faint);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 6px;
}
.nav-item {
  appearance: none;
  text-align: left;
  background: transparent;
  border: 0;
  color: var(--muted);
  font: inherit;
  font-size: 13px;
  padding: 8px 10px;
  border-radius: var(--radius-ctl);
  cursor: pointer;
}
.nav-item:hover {
  background: var(--surface-2);
  color: var(--text);
}
.nav-item.is-active {
  background: var(--surface-3);
  color: var(--text);
  box-shadow: inset 2px 0 0 var(--accent);
}

.nav-foot {
  margin-top: auto;
  border-top: 1px solid var(--border);
  padding-top: 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.nav-foot-row {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--faint);
}
.nav-foot-row strong {
  color: var(--muted);
  font-weight: 600;
}

/* topbar ------------------------------------------------------------------ */

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 28px;
  border-bottom: 1px solid var(--border);
  background: rgba(12, 20, 24, 0.7);
  backdrop-filter: blur(6px);
  position: sticky;
  top: 0;
  z-index: 5;
}
.topbar-left,
.topbar-right {
  display: flex;
  align-items: center;
  gap: 14px;
}
.workspace-name {
  font-weight: 600;
  letter-spacing: 0.02em;
}

.verdict {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
}
.verdict.muted {
  color: var(--faint);
}

.provenance {
  font-size: 12px;
  color: var(--muted);
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 999px;
  white-space: nowrap;
}
.provenance-ok {
  color: var(--ok);
  border-color: rgba(111, 217, 154, 0.32);
}
.provenance-warn {
  color: var(--warn);
  border-color: rgba(239, 193, 105, 0.32);
}
.provenance-info {
  color: var(--info);
}

.primary-btn,
.toggle {
  appearance: none;
  font: inherit;
  font-size: 13px;
  border-radius: var(--radius-ctl);
  padding: 7px 14px;
  cursor: pointer;
}
.primary-btn {
  background: var(--accent);
  color: #06222a;
  border: 0;
  font-weight: 600;
}
.primary-btn:hover {
  filter: brightness(1.07);
}
.toggle {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
}
.toggle.is-on {
  border-color: rgba(111, 217, 154, 0.4);
  color: var(--ok);
}

/* main grid --------------------------------------------------------------- */

.main {
  padding: 24px 28px 48px;
  overflow: auto;
}
.grid {
  display: grid;
  grid-template-columns: minmax(0, 1.65fr) minmax(320px, 1fr);
  gap: 24px;
  align-items: start;
}
.grid-main,
.grid-side {
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-width: 0;
}

/* cards ------------------------------------------------------------------- */

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow);
}
.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}
.card-title {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
}
.card-body {
  padding: 20px;
}
.sub-title {
  margin: 18px 0 10px;
  font-size: 13px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

/* focal card -------------------------------------------------------------- */

.focal-card {
  border-color: var(--border-strong);
  background: linear-gradient(180deg, #16252b, #121d22);
}
.focal-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 18px;
}
.focal-id {
  color: var(--accent);
  font-size: 15px;
}
.focal-title {
  font-size: 20px;
  font-weight: 600;
  line-height: 1.3;
}
.focal-next {
  border-top: 1px dashed var(--border);
  padding-top: 14px;
}
.focal-next-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--faint);
  margin-bottom: 8px;
}
.focal-next-cmd {
  display: flex;
  align-items: center;
  gap: 10px;
}
.focal-next-cmd code {
  background: var(--surface-3);
  padding: 6px 10px;
  border-radius: var(--radius-ctl);
  color: var(--text);
}
.focal-note {
  margin: 8px 0 0;
  font-size: 12px;
  color: var(--faint);
}

.copy-btn,
.link-btn {
  appearance: none;
  font: inherit;
  font-size: 12px;
  cursor: pointer;
  border-radius: var(--radius-ctl);
}
.copy-btn {
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--accent);
  padding: 5px 12px;
}
.copy-btn:hover {
  background: var(--surface-3);
}
.link-btn {
  background: transparent;
  border: 0;
  color: var(--accent);
  padding: 4px 6px;
}

/* metrics ----------------------------------------------------------------- */

.metrics-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.metric {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: 16px;
}
.metric-value {
  font-size: 28px;
  font-weight: 700;
  line-height: 1.1;
}
.metric-ok {
  color: var(--ok);
}
.metric-warn {
  color: var(--warn);
}
.metric-danger {
  color: var(--danger);
}
.metric-info {
  color: var(--info);
}
.metric-muted {
  color: var(--text);
}
.metric-label {
  margin-top: 6px;
  font-size: 13px;
  color: var(--muted);
}
.metric-context {
  margin-top: 2px;
  font-size: 12px;
  color: var(--faint);
}

/* activity feed ----------------------------------------------------------- */

.feed {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
}
.feed-item {
  display: flex;
  gap: 14px;
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
}
.feed-item:last-child {
  border-bottom: 0;
  padding-bottom: 0;
}
.feed-glyph {
  width: 24px;
  height: 24px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 7px;
  background: var(--surface-2);
  font-size: 12px;
}
.feed-ok {
  color: var(--ok);
}
.feed-warn {
  color: var(--warn);
}
.feed-danger {
  color: var(--danger);
}
.feed-info {
  color: var(--info);
}
.feed-main {
  min-width: 0;
  flex: 1;
}
.feed-top {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}
.feed-title {
  font-weight: 600;
}
.feed-time,
.feed-kind {
  color: var(--faint);
  font-size: 12px;
  white-space: nowrap;
}
.feed-summary {
  color: var(--muted);
  font-size: 13px;
  margin-top: 2px;
}
.feed-meta {
  display: flex;
  gap: 12px;
  margin-top: 6px;
  color: var(--faint);
  font-size: 12px;
}

/* proof ------------------------------------------------------------------- */

.proof-verdict {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 16px;
  letter-spacing: 0.04em;
}
.proof-ok {
  color: var(--ok);
}
.proof-warn {
  color: var(--warn);
}
.proof-danger {
  color: var(--danger);
}
.proof-muted {
  color: var(--muted);
}
.proof-note {
  margin: 8px 0 12px;
  color: var(--muted);
  font-size: 13px;
}
.proof-stats {
  display: flex;
  gap: 18px;
  font-size: 13px;
  color: var(--muted);
}
.proof-stats strong {
  color: var(--text);
}
.proof-audit {
  margin-top: 12px;
  padding: 8px 12px;
  border-radius: var(--radius-ctl);
  background: rgba(239, 193, 105, 0.1);
  border: 1px solid rgba(239, 193, 105, 0.3);
  color: var(--warn);
  font-size: 12px;
}
.issue-codes {
  list-style: none;
  margin: 12px 0 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.issue-codes li {
  font-size: 11px;
  color: var(--danger);
  background: rgba(240, 138, 134, 0.1);
  border: 1px solid rgba(240, 138, 134, 0.28);
  padding: 3px 8px;
  border-radius: var(--radius-ctl);
}

/* capsule + evidence + recent --------------------------------------------- */

.capsule-head {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 14px;
}
.capsule-id {
  color: var(--accent);
}
.capsule-title {
  font-weight: 600;
}
.evidence-list,
.recent-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.evidence-item {
  border: 1px solid var(--border);
  border-radius: var(--radius-ctl);
  padding: 10px 12px;
}
.evidence-top {
  display: flex;
  align-items: center;
  gap: 8px;
}
.evidence-id {
  color: var(--muted);
}
.evidence-summary {
  margin-top: 4px;
  font-size: 12px;
  color: var(--faint);
}
.recent-item {
  appearance: none;
  width: 100%;
  text-align: left;
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--radius-ctl);
  padding: 9px 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--text);
  font: inherit;
}
.recent-item:hover {
  background: var(--surface-2);
}
.recent-item.is-active {
  border-color: var(--accent);
  background: var(--surface-2);
}
.recent-id {
  color: var(--accent);
  flex: none;
}
.recent-title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--muted);
  font-size: 13px;
}

.tag {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 999px;
  border: 1px solid var(--border);
  color: var(--muted);
  white-space: nowrap;
}
.tag-ok {
  color: var(--ok);
  border-color: rgba(111, 217, 154, 0.3);
}
.tag-muted {
  color: var(--faint);
}

/* governance kv ----------------------------------------------------------- */

.kv {
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.kv > div {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.kv dt {
  color: var(--faint);
  font-size: 12px;
}
.kv dd {
  margin: 0;
  color: var(--text);
  font-size: 13px;
}
.kv-wrap {
  color: var(--muted) !important;
  font-size: 12px !important;
  line-height: 1.4;
}

/* dev json ---------------------------------------------------------------- */

.dev-json .card-body {
  padding-top: 12px;
}
.dev-note {
  margin: 0 0 10px;
  color: var(--faint);
  font-size: 12px;
}
.json-view {
  margin: 0;
  max-height: 360px;
  overflow: auto;
  background: #0a1014;
  border: 1px solid var(--border);
  border-radius: var(--radius-ctl);
  padding: 14px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--muted);
}

/* dots / pills ------------------------------------------------------------ */

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  display: inline-block;
}
.dot-ok {
  background: var(--ok);
  box-shadow: 0 0 0 3px rgba(111, 217, 154, 0.18);
}
.dot-warn {
  background: var(--warn);
  box-shadow: 0 0 0 3px rgba(239, 193, 105, 0.18);
}
.dot-danger {
  background: var(--danger);
  box-shadow: 0 0 0 3px rgba(240, 138, 134, 0.18);
}
.dot-info {
  background: var(--info);
}
.dot-muted {
  background: var(--faint);
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 999px;
  border: 1px solid var(--border);
  color: var(--muted);
}

/* skeleton / states ------------------------------------------------------- */

.skeleton {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.sk-bar {
  height: 12px;
  border-radius: 6px;
  background: linear-gradient(90deg, var(--surface-2), var(--surface-3), var(--surface-2));
  background-size: 200% 100%;
  animation: sk 1.4s ease-in-out infinite;
}
.sk-title {
  height: 18px;
  width: 40%;
}
@keyframes sk {
  0% {
    background-position: 200% 0;
  }
  100% {
    background-position: -200% 0;
  }
}

.degraded-banner {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(239, 193, 105, 0.08);
  border: 1px solid rgba(239, 193, 105, 0.3);
  color: var(--warn);
  border-radius: var(--radius-ctl);
  padding: 10px 14px;
  margin-bottom: 16px;
  font-size: 13px;
}
.degraded-banner .link-btn {
  margin-left: auto;
}

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  text-align: center;
  padding: 28px 16px;
  color: var(--muted);
}
.empty-mark {
  color: var(--accent-2);
  font-size: 22px;
  opacity: 0.7;
}
.empty-state strong {
  color: var(--text);
}
.empty-state span {
  font-size: 13px;
  color: var(--faint);
  max-width: 320px;
}

/* focus ------------------------------------------------------------------- */

button:focus-visible,
a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* responsive -------------------------------------------------------------- */

@media (max-width: 1180px) {
  .grid {
    grid-template-columns: 1fr;
  }
  .metrics-row {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 768px) {
  .root {
    grid-template-columns: 1fr;
  }
  .sidebar {
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
  }
  .nav-foot {
    display: none;
  }
  .brand-sub {
    display: none;
  }
  .topbar {
    flex-wrap: wrap;
    gap: 10px;
  }
}

/* ───────────── Phase 5.6 fix pass: views, headers, mobile nav ───────────── */

.page-head {
  margin: 0 0 20px;
}
.page-title {
  margin: 0;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.01em;
}
.page-subtitle {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 13px;
}

.grid-single {
  grid-template-columns: minmax(0, 1fr);
}

/* syncing indicator (Refresh / first load feedback) */
.syncing {
  font-size: 12px;
  color: var(--accent);
  opacity: 0.85;
}
.primary-btn:disabled {
  opacity: 0.55;
  cursor: default;
}

/* proof -> evidence drill link */
.proof-drill {
  margin-left: auto;
  color: var(--accent);
}

/* row list (handoff, etc.) */
.row-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.row-list li {
  display: flex;
  gap: 12px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 10px;
}
.row-list li:last-child {
  border-bottom: 0;
  padding-bottom: 0;
}
.row-key {
  flex: none;
  min-width: 132px;
  color: var(--text);
  font-weight: 600;
  font-size: 13px;
}
.row-val {
  color: var(--muted);
  font-size: 13px;
  min-width: 0;
}

/* task counts grid */
.counts-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.count-cell {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-ctl);
  padding: 14px;
  text-align: center;
}
.count-value {
  font-size: 24px;
  font-weight: 700;
}
.count-key {
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
  text-transform: capitalize;
}

.view-note {
  margin: 14px 0 0;
  color: var(--faint);
  font-size: 12px;
}

/* mobile navigation: compact horizontal scroll strip instead of a wrapped block */
@media (max-width: 768px) {
  .root {
    grid-template-columns: 1fr;
  }
  .sidebar {
    flex-direction: row;
    flex-wrap: nowrap;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    overflow-x: auto;
    border-right: 0;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 6;
    background: #0b1216;
  }
  .brand {
    flex: none;
  }
  .brand-sub,
  .nav-foot,
  .nav-label {
    display: none;
  }
  .nav-group {
    flex-direction: row;
    gap: 6px;
    flex: none;
  }
  .nav-item {
    white-space: nowrap;
    padding: 7px 12px;
  }
  .nav-item.is-active {
    box-shadow: inset 0 -2px 0 var(--accent);
  }
  .topbar {
    flex-wrap: wrap;
    gap: 10px;
  }
  .counts-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
