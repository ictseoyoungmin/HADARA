name: T0795 release recovery integrity

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-validate-commit:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch, validate, and commit to validation branch
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -Fq '[t0795 applied]'; then
            echo 'Validated patch is already applied.'
            exit 0
          fi
          python tools/.t0795/fix_apply.py
          python tools/.t0795/apply.py
          bash -n scripts/release/manual-publish-rc.sh
          node --check scripts/release/verify-recovery-evidence.mjs
          git diff --check
          npm ci
          npm run test:hadara-dev -- --run tests/unit/manual-publish-script.test.ts
          npm run check
          git config user.name 'hadara-agent'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/release/manual-publish-rc.sh scripts/release/verify-recovery-evidence.mjs tests/unit/manual-publish-script.test.ts
          git diff --cached --check
          git commit -m 'Harden GitHub-only release recovery integrity [t0795 applied]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
