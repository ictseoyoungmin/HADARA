name: Temporary branch cleanup

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const branches = [
              'agent/t0795-release-recovery-integrity',
              'agent/release-recovery-integrity',
              'agent/branch-cleanup-20260822',
            ];
            for (const branch of branches) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`,
                });
                core.info(`deleted ${branch}`);
              } catch (error) {
                if (error.status === 404 || error.status === 422) {
                  core.info(`already absent or non-deletable: ${branch}`);
                  continue;
                }
                throw error;
              }
            }
